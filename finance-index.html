<html lang="en">

<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --teal-950:#0B2622; --teal-900:#0E332C; --teal-800:#154A40; --teal-700:#1C5C4F;
    --gold:#C9A24B; --gold-light:#E7CD8A; --gold-soft:#F3E7C8;
    --bg:#F6F4EC; --card:#FFFFFF;
    --ink:#1E2620; --muted:#66756A; --line:#E4DFCE;
    --ok:#3F7A56; --ok-bg:#E5F1E8; --bad:#B14A3B; --bad-bg:#F7E7E3;
    --radius:16px; --shadow:0 4px 18px rgba(14,51,44,.07), 0 1px 3px rgba(14,51,44,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Work Sans',sans-serif;background:var(--bg);color:var(--ink);}
  h1,h2,h3{font-family:'Amiri',serif;}
  [dir="rtl"]{font-family:'Noto Nastaliq Urdu','Work Sans',sans-serif;}
  [dir="rtl"] table th, [dir="rtl"] table td{text-align:right;}

  .topnav{background:linear-gradient(180deg,var(--teal-900),var(--teal-800));color:#F2F6EE;padding:0 22px;}
  .topnav-inner{max-width:1100px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-family:'Amiri',serif;font-size:17px;color:var(--gold-light);font-weight:700;}
  .brand span{display:block;font-size:11px;color:rgba(242,246,238,.65);font-family:'Work Sans',sans-serif;font-weight:400;}
  nav.mainnav{display:flex;gap:4px;}
  nav.mainnav button{all:unset;cursor:pointer;padding:9px 16px;border-radius:9px;font-size:14px;color:rgba(242,246,238,.82);}
  nav.mainnav button:hover{background:rgba(255,255,255,.08);}
  nav.mainnav button.active{background:rgba(255,255,255,.12);color:var(--gold-light);font-weight:600;}
  .logout-btn{all:unset;cursor:pointer;padding:8px 14px;border:1px solid rgba(242,246,238,.3);border-radius:8px;font-size:12.5px;color:#F2F6EE;}

  main{max-width:1100px;margin:0 auto;padding:32px 22px 70px;}
  .page-title{font-size:28px;margin:0 0 6px;color:var(--teal-900);}
  .page-sub{color:var(--muted);margin:0 0 24px;font-size:14.5px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;margin-bottom:22px;box-shadow:var(--shadow);}
  .card h3{margin:0 0 16px;font-size:17px;color:var(--teal-900);display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:640px){ .grid2{grid-template-columns:1fr;} }

  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;margin-top:12px;font-weight:600;}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--gold-light);outline-offset:1px;border-color:var(--gold);}
  .btn{all:unset;cursor:pointer;background:linear-gradient(135deg,var(--teal-800),var(--teal-900));color:var(--gold-light);padding:11px 22px;border-radius:10px;font-size:14px;font-weight:700;display:inline-block;margin-top:16px;}
  .btn:hover{filter:brightness(1.12);}
  .btn.small{padding:7px 14px;font-size:12.5px;margin:0;}
  .btn.secondary{background:transparent;color:var(--teal-900);border:1px solid var(--line);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .pill.income{background:var(--ok-bg);color:var(--ok);}
  .pill.expense{background:var(--bad-bg);color:var(--bad);}

  .stat-row{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .stat{flex:1;min-width:170px;background:linear-gradient(150deg,var(--teal-900),var(--teal-700));color:#F2F6EE;border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);}
  .stat .num{font-size:24px;font-family:'Amiri',serif;color:var(--gold-light);}
  .stat .lbl{font-size:12px;color:rgba(242,246,238,.72);margin-top:2px;}

  .lock{text-align:center;padding:60px 20px;max-width:380px;margin:0 auto;}
  .lock .lock-icon{width:52px;height:52px;border-radius:50%;background:var(--teal-900);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--gold-light);font-size:22px;}
  .empty{color:var(--muted);font-size:13.5px;font-style:italic;padding:14px 0;text-align:center;}
  .roll{font-family:'Amiri',serif;color:var(--gold);font-weight:700;}
  .row-actions button{all:unset;cursor:pointer;font-size:12px;color:var(--muted);margin-inline-start:12px;}
  .row-actions button:hover{color:var(--bad);}
  #debugBanner{display:none;background:#F7E7E3;border:1px solid var(--bad);color:#7A2E22;padding:12px 16px;border-radius:10px;font-size:12.5px;margin-bottom:18px;white-space:pre-wrap;}
  .tabs{display:flex;gap:6px;margin:4px 0 18px;flex-wrap:wrap;}
  .tabs button{all:unset;cursor:pointer;padding:9px 18px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--teal-900);border:1px solid var(--line);background:#fff;}
  .tabs button.active{background:linear-gradient(135deg,var(--teal-800),var(--teal-900));color:var(--gold-light);border-color:transparent;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .chip.ok{background:var(--ok-bg);color:var(--ok);} .chip.bad{background:var(--bad-bg);color:var(--bad);}
  .hint{font-size:12px;color:var(--muted);margin:4px 0 0;}
  .err{color:var(--bad);font-size:12.5px;margin-top:8px;min-height:1em;}
  .tablewrap{overflow-x:auto;}
  .row-actions a.walink{color:var(--muted);font-size:12px;margin-inline-start:12px;text-decoration:none;}
  .row-actions a.walink:hover{color:var(--ok);}
  a.btn.walink{text-decoration:none;}
  .raseed-paper{background:#fff;border:3px double var(--gold);border-radius:12px;padding:26px 28px;max-width:560px;margin:0 auto;}
  .rp-head{text-align:center;} .rp-mosque{font-family:'Amiri',serif;font-size:30px;color:var(--teal-900);line-height:1.4;}
  .rp-en{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
  .rp-title{text-align:center;margin:12px 0 14px;font-family:'Amiri',serif;font-size:22px;color:var(--gold);border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);padding:6px 0;}
  .rp-title span{font-family:'Work Sans',sans-serif;font-size:12px;color:var(--muted);margin-inline-start:8px;}
  .rp-table{width:100%;font-size:15px;} .rp-table td{padding:9px 6px;border-bottom:1px dotted var(--line);}
  .rp-table td.k{color:var(--muted);width:34%;} .rp-sign{margin-top:30px;color:var(--muted);font-size:14px;}
  .rp-qr{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:16px;}
  .rp-qrtext{font-size:12.5px;color:var(--muted);line-height:1.8;} .rp-en2{font-size:11px;direction:ltr;text-align:right;}
  @media print{ .noprint,.topnav,#debugBanner{display:none !important;} body{background:#fff;} main{padding:0;} .raseed-paper{border-color:#999;} }

</style>

// ===================== RASEED (receipts) =====================
const MONTHS_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_UR=['جنوری','فروری','مارچ','اپریل','مئی','جون','جولائی','اگست','ستمبر','اکتوبر','نومبر','دسمبر'];
const CATS=[['Monthly Chanda','ماہانہ چندہ'],['Zakat','زکوٰۃ'],['Sadaqah','صدقہ'],['Fitra','فطرہ'],['General Donation','عام عطیہ']];
function catUr(c){ const x=CATS.find(k=>k[0]===c); return x?x[1]:c; }
function todayPK(){ return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Karachi'}); }
function fmtMonth(m,ur){ if(!m) return ''; const p=String(m).split('-'); return (ur?MONTHS_UR:MONTHS_EN)[Number(p[1])-1]+' '+p[0]; }
function monthRange(first,last){
  const out=[]; let y=Number(first.slice(0,4)), m=Number(first.slice(5,7));
  const ly=Number(last.slice(0,4)), lm=Number(last.slice(5,7));
  while((y<ly || (y===ly && m<=lm)) && out.length<240){ out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){ m=1; y++; } }
  return out;
}
function waNumber(c){ let d=String(c||'').replace(/\D/g,''); if(d.length===11 && d[0]==='0') d='92'+d.slice(1); return d; }
function checkLink(code){ return location.origin+'/#mycontrib-'+code; }
function mapReceipt(x){
  return {id:x.finance_id, no:x.receipt_no, code:x.access_code||'', donorId:x.donor_id||null, name:x.donor_name||'',
    contact:x.donor_contact||'', category:x.category, amount:Number(x.amount), date:x.date, forMonth:x.for_month||'', note:x.note||''};
}
function rcErrMsg(e){
  const m=String((e&&e.message)||e);
  const map={invalid_amount:'Amount must be more than 0.', invalid_month:'Choose a valid month.', invalid_date:'Date is not valid (future dates are not allowed).',
    invalid_input:'Please check the name, category and note (no < > characters, not too long).', invalid_contact:'Enter a valid mobile number (at least 7 digits) or leave it empty.',
    not_found:'This receipt was not found. Reload the page.', unauthorized:'Session expired. Log in again.', donor_not_found:'Donor not found. Reload the page.'};
  for(const k in map){ if(m.includes(k)) return map[k]; }
  return null;
}
function monthPicker(name, value){
  const cur=todayPK().slice(0,7);
  const v=(value||cur); const vy=Number(v.slice(0,4)), vm=Number(v.slice(5,7));
  const y0=Number(cur.slice(0,4)); const years=[];
  for(let y=y0-4;y<=y0+1;y++) years.push(y);
  if(!years.includes(vy)){ years.push(vy); years.sort(); }
  return `<div style="display:flex;gap:8px;">
    <select name="${name}_m">${MONTHS_EN.map((n,i)=>`<option value="${i+1}" ${i+1===vm?'selected':''}>${n}</option>`).join('')}</select>
    <select name="${name}_y">${years.map(y=>`<option value="${y}" ${y===vy?'selected':''}>${y}</option>`).join('')}</select></div>`;
}
function readMonth(f,name){ return f.get(name+'_y')+'-'+String(f.get(name+'_m')).padStart(2,'0'); }
function catFields(prefix, current){
  const known = CATS.some(c=>c[0]===current);
  const sel = current ? (known?current:'__other') : 'Monthly Chanda';
  return `<select name="${prefix}Cat" id="${prefix}Cat">${CATS.map(c=>`<option value="${esc(c[0])}" ${sel===c[0]?'selected':''}>${esc(c[0])} — ${esc(c[1])}</option>`).join('')}<option value="__other" ${sel==='__other'?'selected':''}>Other</option></select>
    <input name="${prefix}CatOther" id="${prefix}CatOther" placeholder="Category" value="${known?'':esc(current||'')}" style="margin-top:8px;display:${sel==='__other'?'block':'none'};">`;
}
function readCat(f,prefix){ const v=f.get(prefix+'Cat'); return v==='__other' ? String(f.get(prefix+'CatOther')||'').trim() : v; }

function donorsSummary(){
  const map=new Map();
  receipts.forEach(r=>{
    if(!r.donorId) return;
    let d=map.get(r.donorId);
    if(!d){ d={id:r.donorId,name:r.name,contact:r.contact,code:r.code,total:0,count:0,months:new Set(),last:''}; map.set(r.donorId,d); }
    d.total+=r.amount; d.count++; if(r.forMonth) d.months.add(r.forMonth); if(r.date>d.last) d.last=r.date;
  });
  return [...map.values()].sort((a,b)=>b.total-a.total);
}
function donorMonthStatus(d){
  const paid=[...d.months].sort();
  if(!paid.length) return {paid:[],due:[]};
  const nowM=todayPK().slice(0,7); const lastM = paid[paid.length-1] > nowM ? paid[paid.length-1] : nowM;
  const due=monthRange(paid[0], lastM).filter(m=>!d.months.has(m));
  return {paid,due};
}
function filteredReceipts(){
  const q=raseedSearch.trim().toLowerCase();
  return receipts.filter(r=>{
    if(raseedMonth && (r.forMonth||r.date.slice(0,7))!==raseedMonth) return false;
    if(!q) return true;
    return [r.name,String(r.no||''),r.code,r.category,r.contact].some(v=>String(v).toLowerCase().includes(q));
  });
}

  const list=filteredReceipts();
  const total=list.reduce((s,r)=>s+r.amount,0);
  const months=[...new Set(receipts.map(r=>r.forMonth||r.date.slice(0,7)))].sort().reverse();
  return `<div class="card">
    <h3>All Receipts <button class="btn secondary small" id="rcCsv">Export CSV</button></h3>
    <div class="grid2" style="margin-bottom:6px;">
      <div><input id="raseedSearch" placeholder="Search name, receipt no, code, mobile…" value="${esc(raseedSearch)}"></div>
      <div><select id="raseedMonth"><option value="">All months</option>${months.map(m=>`<option value="${esc(m)}" ${raseedMonth===m?'selected':''}>${esc(fmtMonth(m))}</option>`).join('')}</select></div>
    </div>
    ${list.length ? `<div class="tablewrap"><table><tr><th>No.</th><th>Date</th><th>Donor</th><th>Category</th><th>Amount</th><th></th></tr>
      ${list.map(r=>`<tr>
        <td class="roll">#${esc(r.no)}</td><td>${esc(r.date)}</td>
        <td>${r.name?esc(r.name):'<span style="color:var(--muted);">—</span>'}</td>
        <td>${esc(r.category)}${r.forMonth?` <span class="chip ok">${esc(fmtMonth(r.forMonth))}</span>`:''}</td>
        <td>Rs ${r.amount.toLocaleString()}</td>
        <td class="row-actions"><button class="rcView" data-id="${esc(r.id)}">View</button><button class="rcEdit" data-id="${esc(r.id)}">Edit</button><button class="rcDel" data-id="${esc(r.id)}">Delete</button></td>
      </tr>`).join('')}</table></div>
      <div style="text-align:right;margin-top:10px;font-weight:700;color:var(--teal-900);">${list.length} receipt(s) · Rs ${total.toLocaleString()}</div>`
      : `<div class="empty">${receipts.length?'No receipt matches your search.':'No receipts yet. Use “New Raseed” to issue the first one.'}</div>`}
  </div>`;
}

  const r=receipts.find(x=>x.id===receiptEditId); if(!r) return '';
  return `<div class="card" id="editCard"><h3>Edit Raseed #${esc(r.no)}</h3>
  <form id="editReceiptForm" novalidate>
    ${r.donorId?`<div class="grid2">
      <div><label>Donor Name *</label><input name="name" value="${esc(r.name)}"></div>
      <div><label>Mobile</label><input name="contact" inputmode="tel" value="${esc(r.contact)}"></div>

    <p class="hint">Name and mobile belong to the donor: changing them updates all of this donor's receipts.</p>`:''}
    <div class="grid2">
      <div><label>Category *</label>${catFields('edt', r.category)}</div>
      <div id="edtMonthWrap"><label>For which month</label>${monthPicker('edtFm', r.forMonth||r.date.slice(0,7))}</div>
    </div>
    <div class="grid2">
      <div><label>Amount (PKR) *</label><input name="amount" type="number" min="1" inputmode="numeric" value="${esc(r.amount)}"></div>

}

  const det=donorDetailId ? donors.find(d=>d.id===donorDetailId) : null;
  let detail='';
  if(det){
    const st=donorMonthStatus(det);
    detail=`<div class="card"><h3>${esc(det.name)} <button class="btn secondary small" id="dnClose">Close</button></h3>
      <p class="hint">Mobile: ${esc(det.contact||'—')} · Private code: <b>${esc(det.code)}</b></p>
      ${st.paid.length ? `<div style="margin-top:8px;"><b style="color:var(--ok);">Months paid (${st.paid.length})</b><div class="chips">${st.paid.map(m=>`<span class="chip ok">${esc(fmtMonth(m))}</span>`).join('')}</div></div>
        <div style="margin-top:12px;"><b style="color:var(--bad);">Months due (${st.due.length})</b><div class="chips">${st.due.length?st.due.map(m=>`<span class="chip bad">${esc(fmtMonth(m))}</span>`).join(''):'<span class="hint">None. All clear.</span>'}</div></div>`
        : '<div class="empty">No monthly chanda receipts for this donor yet.</div>'}

  }
  return `${detail}<div class="card"><h3>Donors</h3>

      ${donors.map(d=>{ const st=donorMonthStatus(d); const link=checkLink(d.code);
        const msg='Assalam o Alaikum '+d.name+'. Jamia Masjid Hudabia: apni chanda ki receipts yahan dekhein (private link): '+link;
        const wa=waNumber(d.contact);
        return `<tr>
        <td>${esc(d.name)}<div class="hint">${esc(d.contact||'')}</div></td><td>${d.count}</td><td>Rs ${d.total.toLocaleString()}</td>
        <td>${st.paid.length?`<span class="chip ok">${st.paid.length} paid</span> <span class="chip ${st.due.length?'bad':'ok'}">${st.due.length} due</span>`:'—'}</td>
        <td>${esc(d.last)}</td>
        <td class="row-actions"><button class="dnView" data-id="${esc(d.id)}">View</button><button class="dnCopy" data-link="${esc(link)}">Copy link</button>${wa?`<a class="walink" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}">WhatsApp</a>`:''}</td></tr>`; }).join('')}
    </table></div>` : '<div class="empty">Donors appear here after the first raseed is issued.</div>'}

function drawReceiptQR(){
  if(!receiptShown || !receiptShown.code || !window.QRCode) return;
  const box=el('rcQr'); if(!box) return;
  box.innerHTML='';
  new QRCode(box,{text:checkLink(receiptShown.code), width:110, height:110, colorDark:'#0E332C', colorLight:'#ffffff'});
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); }catch(e){ window.prompt('Copy this link:', text); }
}

function wireCat(prefix){
  const sel=el(prefix+'Cat'), other=el(prefix+'CatOther'), wrap=el(prefix+'MonthWrap');
  if(!sel) return;
  const upd=()=>{ other.style.display = sel.value==='__other' ? 'block' : 'none'; wrap.style.display = sel.value==='Monthly Chanda' ? 'block' : 'none'; };
  sel.onchange=upd; upd();
}

function bindRowButtons(){
  document.querySelectorAll('.rcView').forEach(b=> b.onclick=()=>{ receiptShown = receipts.find(r=>r.id===b.dataset.id)||null; render(); });
  document.querySelectorAll('.rcEdit').forEach(b=> b.onclick=()=>{ receiptEditId=b.dataset.id; render(); const c=el('editCard'); if(c&&c.scrollIntoView) c.scrollIntoView({behavior:'smooth',block:'start'}); });
  document.querySelectorAll('.rcDel').forEach(b=> b.onclick=async()=>{
    const r=receipts.find(x=>x.id===b.dataset.id); if(!r) return;
    if(!confirm('Delete raseed #'+r.no+(r.name?' ('+r.name+')':'')+'? This cannot be undone (it is kept in the audit log).')) return;
    try{
      const {error}=await sb.rpc('delete_finance_entry',{p_username:financeUser,p_password:financePass,p_id:r.id});
      if(error) throw error;
      receiptEditId=null; await loadFinanceData(); render();
    }catch(e){ showDebugError(e.message||String(e)); }
  });
}
function refreshList(){ const a=el('raseedListArea'); if(!a) return; a.innerHTML=renderListInner(); wireListControls(); bindRowButtons(); }
function wireListControls(){
  const s=el('raseedSearch'), m=el('raseedMonth'), c=el('rcCsv');
  if(s) s.oninput=()=>{ raseedSearch=s.value; refreshListKeepFocus(); };
  if(m) m.onchange=()=>{ raseedMonth=m.value; refreshList(); };
  if(c) c.onclick=()=>{
    const rows=[['Receipt No','Date','Donor','Mobile','Category','For Month','Amount','Note'],
      ...filteredReceipts().map(r=>[r.no,csvSafe(r.date),csvSafe(r.name),csvSafe(r.contact),csvSafe(r.category),csvSafe(r.forMonth),r.amount,csvSafe(r.note)])];
    const csv=rows.map(x=>x.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='raseed-receipts.csv'; a.click();
  };
}
function refreshListKeepFocus(){
  const pos=el('raseedSearch')?el('raseedSearch').selectionStart:0;
  refreshList(); const s=el('raseedSearch'); if(s){ s.focus(); try{ s.setSelectionRange(pos,pos); }catch(e){} }
}

function bindRaseedEvents(){
  document.querySelectorAll('[data-rv]').forEach(b=> b.onclick=()=>{ raseedView=b.dataset.rv; receiptEditId=null; donorDetailId=null; render(); });

  // issue form
  const issueForm=el('issueForm');
  if(issueForm){
    wireCat('iss');
    const dSel=el('issDonor'), nameI=el('issName'), contI=el('issContact');
    dSel.onchange=()=>{
      const d=donorsSummary().find(x=>x.id===dSel.value);
      if(d){ nameI.value=d.name; contI.value=d.contact||''; nameI.disabled=true; contI.disabled=true; }
      else { nameI.value=''; contI.value=''; nameI.disabled=false; contI.disabled=false; }
    };
    issueForm.onsubmit=async e=>{
      e.preventDefault();
      const f=new FormData(issueForm), err=el('issErr'); err.textContent='';
      const donor=donorsSummary().find(x=>x.id===dSel.value)||null;
      const name = donor ? donor.name : String(f.get('name')||'').trim();
      const contact = donor ? (donor.contact||'') : String(f.get('contact')||'').trim();
      const category=readCat(f,'iss'); const amount=Number(f.get('amount')); const date=String(f.get('date')||'');
      if(!name || !category || !(amount>0) || !date){ err.textContent=T.fillRequired; return; }
      if(contact && contact.replace(/\D/g,'').length<7){ err.textContent='Enter a valid mobile number (at least 7 digits) or leave it empty.'; return; }
      const forMonth = category==='Monthly Chanda' ? readMonth(f,'issFm') : null;
      try{
        const {data,error}=await sb.rpc('issue_receipt_v2',{p_username:financeUser,p_password:financePass,p_donor_id:donor?donor.id:null,p_name:name,p_contact:contact,
          p_category:category,p_amount:amount,p_date:date,p_for_month:forMonth,p_note:String(f.get('note')||'').trim()});
        if(error) throw error;
        const row=Array.isArray(data)?data[0]:data;
        await loadFinanceData();
        receiptShown = receipts.find(r=>r.id===row.finance_id) || mapReceipt(row);
        raseedView='list'; render();
      }catch(ex){ const m=rcErrMsg(ex); if(m) err.textContent=m; else { err.textContent='Could not issue the raseed.'; showDebugError(ex.message||String(ex)); } }
    };
  }

  // list + edit
  wireListControls(); bindRowButtons();
  const editForm=el('editReceiptForm');
  if(editForm){
    wireCat('edt');
    el('edtCancel').onclick=()=>{ receiptEditId=null; render(); };
    editForm.onsubmit=async e=>{
      e.preventDefault();
      const r=receipts.find(x=>x.id===receiptEditId); if(!r) return;
      const f=new FormData(editForm), err=el('edtErr'); err.textContent='';
      const category=readCat(f,'edt'); const amount=Number(f.get('amount')); const date=String(f.get('date')||'');
      const name = r.donorId ? String(f.get('name')||'').trim() : '';
      const contact = r.donorId ? String(f.get('contact')||'').trim() : '';
      if((r.donorId && !name) || !category || !(amount>0) || !date){ err.textContent=T.fillRequired; return; }
      if(contact && contact.replace(/\D/g,'').length<7){ err.textContent='Enter a valid mobile number (at least 7 digits) or leave it empty.'; return; }
      const forMonth = category==='Monthly Chanda' ? readMonth(f,'edtFm') : null;
      try{
        const {error}=await sb.rpc('update_receipt',{p_username:financeUser,p_password:financePass,p_id:r.id,p_donor_name:name,p_donor_contact:contact,
          p_category:category,p_amount:amount,p_date:date,p_for_month:forMonth,p_note:String(f.get('note')||'').trim()});
        if(error) throw error;
        receiptEditId=null; await loadFinanceData(); render();
      }catch(ex){ const m=rcErrMsg(ex); if(m) err.textContent=m; else { err.textContent='Could not save.'; showDebugError(ex.message||String(ex)); } }
    };
  }

  // donors
  document.querySelectorAll('.dnView').forEach(b=> b.onclick=()=>{ donorDetailId=b.dataset.id; render(); });
  const dnClose=el('dnClose'); if(dnClose) dnClose.onclick=()=>{ donorDetailId=null; render(); };
  document.querySelectorAll('.dnCopy').forEach(b=> b.onclick=()=> copyText(b.dataset.link));

  // receipt page
  const rcBack=el('rcBack'); if(rcBack) rcBack.onclick=()=>{ receiptShown=null; render(); };
  const rcPrint=el('rcPrint'); if(rcPrint) rcPrint.onclick=()=>{ window.print(); };
  const rcCopy=el('rcCopy'); if(rcCopy) rcCopy.onclick=()=> copyText(rcCopy.dataset.link);
}

function bindEvents(){
  bindRaseedEvents();
  const finLoginBtn = el('finLoginBtn');
  if(finLoginBtn) finLoginBtn.onclick = async ()=>{
    const u=el('finUser').value.trim(), p=el('finPass').value;
    if(!u||!p) return;
    try{
      const {data, error} = await sb.rpc('verify_login', {p_username:u, p_password:p});
      if(error) throw error;
      if(data === 'finance'){ financeUser=u; financePass=p; financeOK=true; await loadFinanceData(); renderNav(); render(); }
      else { el('finErr').textContent = data === 'locked' ? T.lockedMsg : T.wrongCreds; }
    }catch(e){ showDebugError(e.message || String(e)); }
  };

  document.querySelectorAll('[data-rt]').forEach(b=> b.onclick = ()=>{ roznamchaType = b.dataset.rt; render(); });

  const finForm = el('finForm');
  const categorySelect = el('categorySelect');
  if(categorySelect) categorySelect.onchange = ()=>{ el('categoryOther').style.display = categorySelect.value==='__other' ? 'block' : 'none'; };
  if(finForm) finForm.onsubmit = async e=>{
    e.preventDefault();
    const f=new FormData(finForm);
    const amount=f.get('amount'), date=f.get('date');
    if(!amount || Number(amount)<=0 || !date){ el('finFormErr').textContent = T.fillRequired; return; }
    const cat = f.get('categorySelect')==='__other' ? f.get('categoryOther').trim() : f.get('categorySelect');
    try{
      const {data, error} = await sb.rpc('add_finance_entry', {p_username:financeUser, p_password:financePass, p_type:f.get('type'), p_category:cat||'Other', p_amount:Number(amount), p_date:date, p_note:f.get('note')});
      if(error) throw error;
      finance.push({id:data.id, type:data.type, category:data.category, amount:data.amount, date:data.date, note:data.note, receiptNo:data.receipt_no});
      render();
    }catch(e){ showDebugError(e.message || String(e)); }
  };
  document.querySelectorAll('.delFin').forEach(b=> b.onclick = async ()=>{
    const idx = Number(b.dataset.i); const rec = finance[idx];
    try{
      const {error} = await sb.rpc('delete_finance_entry', {p_username:financeUser, p_password:financePass, p_id:rec.id});
      if(error) throw error;
      finance.splice(idx,1); render();
    }catch(e){ showDebugError(e.message || String(e)); }
  });
  const csvBtn = el('csvBtn');
  if(csvBtn) csvBtn.onclick = ()=>{
    const rows=[['Date','Type','Category','Amount','Note','Receipt No'], ...finance.map(f=>[csvSafe(f.date),csvSafe(f.type),csvSafe(f.category),f.amount,csvSafe(f.note||''),csvSafe(f.receiptNo||'')])];
    const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='finance-ledger.csv'; a.click();
  };

  const roznForm = el('roznForm');
  if(roznForm) roznForm.onsubmit = async e=>{
    e.preventDefault();
    const f = new FormData(roznForm);
    const amount = f.get('amount'), date = f.get('date'), details = f.get('details').trim();
    if(!amount || Number(amount)<=0 || !date || !details){ el('roznFormErr').textContent = T.fillRequired; return; }
    try{
      const {data, error} = await sb.rpc('add_finance_entry', {p_username:financeUser, p_password:financePass, p_type:roznamchaType, p_category:details, p_amount:Number(amount), p_date:date, p_note:null});
      if(error) throw error;
      finance.push({id:data.id, type:data.type, category:data.category, amount:data.amount, date:data.date, note:data.note, receiptNo:data.receipt_no});
      render();
      const income = finance.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount),0);
      const expense = finance.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount),0);
      const net = income - expense;
      const box = el('roznStatusBox');
      if(box){
        const isProfit = net >= 0;
        box.innerHTML = `<div class="card" style="background:${isProfit?'var(--ok-bg)':'var(--bad-bg)'};border-color:${isProfit?'var(--ok)':'var(--bad)'};">
          <p style="margin:0;color:${isProfit?'var(--ok)':'var(--bad)'};font-weight:700;">${isProfit ? T.entryAddedProfit : T.entryAddedLoss} Rs ${Math.abs(net).toLocaleString()}</p>
        </div>`;
      }
    }catch(e){ showDebugError(e.message || String(e)); }
  };

  const roznPrintBtn = el('roznPrintBtn');
  if(roznPrintBtn) roznPrintBtn.onclick = ()=>{
    const entries = finance.filter(f=>f.type===roznamchaType).slice().sort((a,b)=> a.date<b.date?-1:1);
    roznamchaEditRows = JSON.parse(JSON.stringify(entries));
    roznamchaPrintMode = true;
    render();
  };
  const roznCancelPrint = el('roznCancelPrint');
  if(roznCancelPrint) roznCancelPrint.onclick = ()=>{ roznamchaPrintMode=false; render(); };
  const roznDoPrint = el('roznDoPrint');
  if(roznDoPrint) roznDoPrint.onclick = ()=>{ window.print(); };
  document.querySelectorAll('[data-plang]').forEach(b=> b.onclick = ()=>{ roznamchaPrintLang = b.dataset.plang; render(); });
  document.querySelectorAll('#printArea input[data-ri]').forEach(inp=> inp.onchange = ()=>{
    const i = Number(inp.dataset.ri), field = inp.dataset.field;
    if(field==='details'){ roznamchaEditRows[i].category = inp.value; roznamchaEditRows[i].note=null; }
    else if(field==='amount'){ roznamchaEditRows[i].amount = inp.value; }
    else { roznamchaEditRows[i][field] = inp.value; }
  });
}

el('finLogoutBtn').onclick = ()=>{ financeOK=false; financeUser=null; financePass=null; financeView='dashboard'; receipts=[]; finance=[]; receiptShown=null; receiptEditId=null; donorDetailId=null; render(); renderNav(); };

renderNav();
render();
</script>
